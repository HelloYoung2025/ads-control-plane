[project]
name = "ads-write-executor"
version = "0.1.0"
requires-python = ">=3.12"
# 隔离执行器：唯一允许持有 Write Adapter 与写凭据的部署单元。
# 依赖方向单向：executor -> ads-control-plane（core 域）。反向 import 是缺陷，
# 由 tests/unit/test_package_isolation.py 断言。禁止依赖：LLM SDK、fastapi、前端。
dependencies = [
    "ads-control-plane",
    "pydantic>=2.9",
]

[tool.uv.sources]
ads-control-plane = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_write_executor"]
