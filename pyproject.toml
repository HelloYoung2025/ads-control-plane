[project]
name = "ads-control-plane"
version = "0.1.1"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx2>=2.12",
    "mcp>=2.1,<3",
    "pydantic>=2.9",
    "uvicorn>=0.52.4",
]

[project.scripts]
amazon-ads = "ads_control_plane.sfw.__main__:main"
# SFW 插件装好后，引擎用 stdio 拉起来的就是这一条。
amazon-ads-mcp = "ads_control_plane.sfw.plugin:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["ads_control_plane"]
mypy_path = "src"
