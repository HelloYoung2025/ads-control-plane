[project]
name = "ads-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "mcp>=2.1,<3",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ads-write-executor",
    "httpx>=0.28.1",
]

[tool.uv.workspace]
members = ["executor"]

[tool.uv.sources]
ads-write-executor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["ads_control_plane"]
mypy_path = "src"
