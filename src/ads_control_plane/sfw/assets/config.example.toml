# amazon-ads 配置。只有服务用户能读（0600）：别复制到别处，别把密钥贴进聊天。
# 改完执行 sudo amazon-ads doctor 检查，再 sudo amazon-ads start。

# 平台内部身份：安装时生成，固定不变。
organization_id = "00000000-0000-4000-8000-000000000001"
connection_id = "00000000-0000-4000-8000-000000000002"

# SFW 调用本组件时要带的口令：安装时生成，逐格填进 SFW「添加服务器」的认证凭据；改了这里要重新登记。
sfw_bearer = "<安装时自动生成的口令，不要手改>"

# 产物目录与运行记录；路径里不能有空格。
export_dir = "/Users/Shared/amazon-ads/导出"
run_log_path = "/Users/Shared/amazon-ads/运行记录.csv"

# 过了这么多秒就不再开跑下一家店（60 到 3000）；没轮到的店下次再跑。
time_budget_seconds = 2700

# 领星网关。url 是领星帮助中心给的地址，一般不用改。
# key：在领星 ERP 打开「AI助手」→【MCP】，点「复制密钥」，粘进下面 key 的两个引号中间。
# 看不到这个入口：要公司的领星超级管理员先在【业务配置 → 开放接口 → MCP】里开通
# （领星说仅限付费用户）。key 跟着领星账号走，这个账号能看到哪些店，下面这行就列出哪些店。
# key 填好后，在「终端」里粘下面这行（别带前面的 #），它会打印可以直接粘贴的店铺段落：
#   sudo amazon-ads shops
[lingxing]
url = "https://openmcp.lingxing.com/mcp-servers/lingxing-mcp"
key = ""

# 店铺表：每家店一段，五项都要填（上面那行 shops 会打印可直接粘贴的段落）。
# nickname 是给人看的名字，会进文件名：中文、字母、数字、下划线、连字符，
# 不超过 20 个字，不能有空格，不能以连字符开头。
# currency 要在下面 [thresholds.min_spend] 里有一档门槛。
# [[stores]]
# profile_id = "1000000000000001"
# sid = "2000000000000001"
# marketplace = "US"
# currency = "USD"
# nickname = "美国店"

# 判定门槛：回看天数 7 到 90；点击至少 10。
# max_data_staleness_hours 量的是**取数缓存的年龄**，不是领星那边数据有多陈：
# 缓存最长 1 小时，所以填 2 以上等同于关闭这道门（合法范围仍是 1 到 72）。
[thresholds]
lookback_days = 30
min_clicks = 25
max_data_staleness_hours = 24

# 按币种的花费门槛：金额写成带引号的字符串（"20.00"），不要写裸数字。
[thresholds.min_spend]
USD = "20.00"
