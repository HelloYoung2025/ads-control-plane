# ads-pack 配置。只有服务用户能读（0600）：别复制到别处，别把密钥贴进聊天。
# 改完执行 sudo ads-pack doctor 检查，再 sudo ads-pack start。

# 平台内部身份：安装时生成，固定不变。
organization_id = "00000000-0000-4000-8000-000000000001"
connection_id = "00000000-0000-4000-8000-000000000002"

# SFW 调用本组件时要带的口令：安装时生成，粘进 SFW 登记 JSON 的 secret；改了这里要重新登记。
sfw_bearer = "<安装时自动生成的口令，不要手改>"

# 产物目录与运行记录；路径里不能有空格。
export_dir = "/Users/Shared/ads-pack/导出"
run_log_path = "/Users/Shared/ads-pack/运行记录.csv"

# 一次调用最多跑多少秒（60 到 3600）；没轮到的店下次再跑。
time_budget_seconds = 3300

# 领星网关：填好后 sudo ads-pack shops 能列出可选店铺。
[lingxing]
url = ""
key = ""

# 店铺表：每家店一段，五项都要填（sudo ads-pack shops 会打印可粘贴的段落）。
# nickname 是给人看的名字，会进文件名：中文、字母、数字、下划线、连字符，
# 不超过 20 个字，不能有空格。
# currency 要在下面 [thresholds.min_spend] 里有一档门槛。
# [[stores]]
# profile_id = "1000000000000001"
# sid = "2000000000000001"
# marketplace = "US"
# currency = "USD"
# nickname = "美国店"

# 判定门槛：回看天数 7 到 90；点击至少 10；数据最多多旧（小时）1 到 72。
[thresholds]
lookback_days = 30
min_clicks = 25
max_data_staleness_hours = 24

# 按币种的花费门槛：金额写成带引号的字符串（"20.00"），不要写裸数字。
[thresholds.min_spend]
USD = "20.00"
